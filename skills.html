<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills & Interests - EntreSkill Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo">EntreSkill Hub</div>
  <div class="menu">
    <a href="index.html">Home</a>
    <a href="skills.html">Skills</a>
    <a href="business-ideas.html">Business Ideas</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="roadmap.html">Roadmap</a>
    <a href="training.html">Training</a>
    <a href="mentors.html">Mentors</a>
  </div>
</nav>
<header>
  <h1>EntreSkill Hub</h1>
  <p>Select Your Skills and Interests</p>
</header>

<div class="skills-section">

  <!-- Progress bar -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <form id="skillsForm">

    <h2>Select Your Skills</h2>
    <div class="skills-grid">
      <label class="skill-card"><input type="checkbox" name="skill" value="tailoring"> 🧵 Tailoring</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="craft"> 🎨 Handicrafts</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="cooking"> 🍲 Food Preparation</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="repair"> 🔧 Repair Services</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="digital"> 💻 Digital Skills</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="graphic"> 🖌 Graphic Design</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="photography"> 📸 Photography</label>
      <label class="skill-card"><input type="checkbox" name="skill" value="beauty"> 💄 Beauty & Makeup</label>
    </div>

    <h3>Skill Level</h3>
    <select name="skillLevel" id="skillLevel">
      <option value="">Select your level</option>
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
<br><br>
    <h2>Select Your Interests</h2>
    <div class="skills-grid">
      <label class="skill-card"><input type="checkbox" name="interest" value="fashion"> 👗 Fashion</label>
      <label class="skill-card"><input type="checkbox" name="interest" value="art"> 🎨 Art & Craft</label>
      <label class="skill-card"><input type="checkbox" name="interest" value="cooking"> 🍳 Cooking</label>
      <label class="skill-card"><input type="checkbox" name="interest" value="technology"> 💻 Technology</label>
      <label class="skill-card"><input type="checkbox" name="interest" value="business"> 📈 Business</label>
      <label class="skill-card"><input type="checkbox" name="interest" value="digitalMarketing"> 📱 Digital Marketing</label>
      <label class="skill-card"><input type="checkbox" name="interest" value="photography"> 📸 Photography</label>
    </div>

    <button type="button" id="nextBtn" class="main-btn">Find Business Ideas</button>

  </form>
</div>
<script src="script.js"></script>
</body>
</html>
